<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE-edge">
  <meta name="viewport" content="width-device-width, initial-scale-1.0">

  <meta name="author" content="The Runtime Errors">
  <meta name="keywords" content="">
  <title>Movie List | LiveHive</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/main.css">
</head>
<!-- onload="GenreLoads()" -->
<body> 
  <nav class="navbar navbar-expand-xl fixed-top bg-body-secondary custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/imgs/Logo.png" alt="Logo" style="max-width: 150px; margin-left: 10px;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02"
        aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" aria-current="page" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="movie_list.html">Movies</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="watchlist.html">Your List</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input id="searchBar" class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <a href="sign_up.html" class="btn btn-outline-success" type="submit">Login</a>
        </form>
      </div>
    </div>
  </nav>

  <div class="dropdown-container container-fluid below-nav fixed-top d-flex justify-content-end gap-2">
    
    <!-- Filter Dropdown -->
    <div class="dropdown-center">
      <button id="listDropdown" class="btn btn-secondary btn-lg dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Filter by Genre
      </button>
      <ul class="dropdown-menu" id="genre-filter">
        <li><a class="dropdown-item" onclick="DisplayMovies()">Clear Filter</a></li>
        <li><hr class="dropdown-divider"></li>
      </ul>
    </div>

    <!-- Sort Dropdown -->
    <div class="dropdown-center">
      <button id="sortDropdown" class="btn btn-secondary btn-lg dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Sort by
      </button>
      <ul class="dropdown-menu" id="sort-options">
        <li><a class="dropdown-item" onclick="SortMovies('az')">Title: A to Z</a></li>
        <li><a class="dropdown-item" onclick="SortMovies('za')">Title: Z to A</a></li>
        <li><a class="dropdown-item" onclick="SortMovies('newest')">Year: Newest</a></li>
        <li><a class="dropdown-item" onclick="SortMovies('oldest')">Year: Oldest</a></li>
        <li><a class="dropdown-item" onclick="SortMovies('high')">Rating: High to Low</a></li>
        <li><a class="dropdown-item" onclick="SortMovies('low')">Rating: Low to High</a></li>
      </ul>
    </div>

</div>


  <div id="movie-list-container" class="container-fluid">
    <div id="searchBackBtn" class="container mt-5 d-none">
      <button onclick="ExitSearchMode()" class="btn btn-outline-danger mb-3">Back to Browse</button>
    </div>
    <div class="row" id="movieCards">

    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../js/jQuery.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
